[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.37"
# Every contract targets Monad, so forge uses the Monad EVM (and can fork chain 143).
network = "monad"
# Tests read the pinned fork config, the build output (the AgentNFT ABI check)
# the oracle and breaker parity fixture that packages/policy writes (P2-U3), and
# devenv's copy of LocalFeed's code (D-236).
fs_permissions = [
  { access = "read", path = "./fork.json" },
  { access = "read", path = "./out" },
  { access = "read", path = "../../packages/policy/fixtures" },
  { access = "read", path = "../../packages/devenv/src/local-feed-code.ts" },
]

[profile.default.invariant]
# Each run mints up to 40 agents per call and the invariants read every
# agent, so fewer, deeper runs keep the suite to a few minutes.
runs = 48
depth = 60
fail_on_revert = false

[rpc_endpoints]
# Resolved from the environment only; the URL is never written to a file.
monad = "${MONAD_RPC_URL}"
# Monad testnet, for P2-EC's testnet fork test (pnpm test:testnet-fork) only.
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_location = "txt"
recursive_deps = false

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.7.0"

