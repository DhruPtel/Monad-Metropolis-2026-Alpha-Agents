[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.37"
# Tests read the pinned fork config; nothing else on disk.
fs_permissions = [{ access = "read", path = "./fork.json" }]

[rpc_endpoints]
# Resolved from the environment only; the URL is never written to a file.
monad = "${MONAD_RPC_URL}"

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_location = "txt"
recursive_deps = false

[dependencies]
forge-std = "1.16.2"

