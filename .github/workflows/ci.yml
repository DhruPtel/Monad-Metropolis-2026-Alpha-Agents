name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  foundry:
    name: Foundry build and non-fork tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read pinned Foundry version
        id: foundry-version
        run: echo "version=$(cat .foundry-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ steps.foundry-version.outputs.version }}

      - name: Install dependencies
        working-directory: chains/monad
        run: forge soldeer install

      - name: Build
        working-directory: chains/monad
        run: forge build

      - name: Test (fork tests excluded)
        working-directory: chains/monad
        run: forge test --no-match-path 'test/fork/**' -vv

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Scan
        run: node scripts/secrets-scan.js

  web:
    name: Web and console build, component and screenshot tests
    runs-on: ubuntu-latest
    # The same Playwright image scripts/web-e2e.js uses locally, so screenshots match.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @alpha-agents/web build

      - name: Component tests
        run: pnpm exec vitest run --project ui --project console

      - name: Web screenshot and accessibility tests
        working-directory: apps/web
        run: node node_modules/@playwright/test/cli.js test

      - name: Build the dev console
        run: pnpm --filter @alpha-agents/console build

      - name: Console screenshot and accessibility tests
        working-directory: apps/console
        run: node node_modules/@playwright/test/cli.js test

      - name: Upload Playwright diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-diffs
          path: |
            apps/web/test-results/
            apps/console/test-results/
          if-no-files-found: ignore
          retention-days: 14
