name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, typecheck, test
    runs-on: ubuntu-latest
    # The database, indexer, control API and orchestrator tests need Postgres and Redis; they
    # skip without them. Same images as infra/compose.yaml, on the ports the local defaults use.
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: alpha
          POSTGRES_PASSWORD: alpha_local_dev_only
          POSTGRES_DB: alpha_agents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha -d alpha_agents"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check that the database tests ran
        # A skipped suite looks like a pass; fail if Postgres was not reachable to the tests.
        run: pnpm exec vitest run packages/db services/orchestrator/src/provisioning.test.ts --reporter=verbose 2>&1 | tee db-tests.log && ! grep -q "skipped" db-tests.log

  foundry:
    name: Foundry build and non-fork tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read pinned Foundry version
        id: foundry-version
        run: echo "version=$(cat .foundry-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ steps.foundry-version.outputs.version }}

      - name: Install dependencies
        working-directory: chains/monad
        run: forge soldeer install

      - name: Build
        working-directory: chains/monad
        run: forge build

      - name: Test (fork tests excluded)
        working-directory: chains/monad
        run: forge test --no-match-path 'test/fork/**' -vv

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Scan
        run: node scripts/secrets-scan.js

  web:
    name: Web and console build, component and screenshot tests
    runs-on: ubuntu-latest
    # The same Playwright image scripts/web-e2e.js uses locally, so screenshots match.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web app, real and test, and check what each contains
        run: node scripts/check-web-build.js

      - name: Component tests
        run: pnpm exec vitest run --project ui --project console

      - name: Web screenshot and accessibility tests
        working-directory: apps/web
        run: node node_modules/@playwright/test/cli.js test

      - name: Build the dev console
        run: pnpm --filter @alpha-agents/console build

      - name: Console screenshot and accessibility tests
        working-directory: apps/console
        run: node node_modules/@playwright/test/cli.js test

      - name: Upload Playwright diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-diffs
          path: |
            apps/web/test-results/
            apps/console/test-results/
          if-no-files-found: ignore
          retention-days: 14
